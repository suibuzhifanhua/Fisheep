# v1.0.736（遗留③）：关闭 pytest basetemp 的轮换清理。
#
# 全量 1600+ 用例每次运行都会在 %TEMP%/pytest-of-A1/ 下新建一个 pytest-N/
# （内含几百个 tmp_path 子目录、几千个文件）。pytest 默认
# tmp_path_retention_count=3，于是每次会话开始 make_numbered_dir_with_cleanup()
# 都会 rm_rf 掉一个旧的 pytest-N/ —— 一次删几千个文件，被 WorkBuddy 沙箱的
# safe-delete 钩子拦下，命令末尾甩一条「命令被安全策略拦截」（pytest 本身
# exit 0、结果全绿，纯噪音且容易被误读成测试失败）。
#
# 调大保留数后不再轮换删除，噪音源消失。代价：%TEMP%/pytest-of-A1/ 会累积
# 历史会话目录；需要回收时手动删该目录下旧的 pytest-N/ 即可，不影响测试。
# 项目侧另有 tests/conftest.py 把 tempfile.mkdtemp 收敛到固定会话 base，
# 并在**会话开始**统一回收（会话末零删除），两层配合不再有退出期批量删。
[pytest]
tmp_path_retention_count = 10000
