# v1.0.736（遗留③）：关闭 pytest basetemp 的轮换清理。
#
# 全量 1600+ 用例每次运行都会在 %TEMP%/pytest-of-<用户名>/ 下新建一个 pytest-N/
# （内含几百个 tmp_path 子目录、几千个文件）。pytest 默认
# tmp_path_retention_count=3，于是每次会话开始 make_numbered_dir_with_cleanup()
# 都会 rm_rf 掉一个旧的 pytest-N/ —— 一次删几千个文件，被 WorkBuddy 沙箱的
# safe-delete 钩子拦下，命令末尾甩一条「命令被安全策略拦截」（pytest 本身
# exit 0、结果全绿，纯噪音且容易被误读成测试失败）。
#
# 调大保留数后不再轮换删除，噪音源消失。代价：%TEMP%/pytest-of-<用户名>/ 会累积
# 历史会话目录；需要回收时手动删该目录下旧的 pytest-N/ 即可，不影响测试。
# 项目侧另有 tests/conftest.py 把 tempfile.mkdtemp 收敛到固定会话 base，
# 并在**会话开始**统一回收（会话末零删除），两层配合不再有退出期批量删。
[pytest]
tmp_path_retention_count = 10000
# v1.0.751：github_public/ 公开镜像（含 tests/ 同名副本）不参与收集
# （与 tests/ 同名模块会 import file mismatch 撞 100+ 错）。
# v1.0.754：镜像迁出仓库根（Fisheep 主目录/待发布版本/），条目换成新名保底。
# 显式列表会**覆盖整个默认**，须把默认项（dist/CVS/node_modules/…）一并写全
# （751 首跑漏写 dist → 把打包产物 dist/产物库/组件 里的第三方 tests 收了，10 error）。
# v1.0.768：产物库/ 补进排除——e2e 实跑前置把 OCR 旁挂运行时（numpy/onnxruntime 等
# 225MB 第三方包）复制进源树 产物库/ocr/ 后，其 *_test.py（如 onnxruntime 的
# bert_perf_test.py）被收集成 2 个 collection error（缺 hypothesis/psutil 依赖）。
# 与 dist 同口径：构建产物/旁挂运行时永不进收集（dist 侧靠 dist 条目，源树侧靠本条目）。
norecursedirs = build 待发布版本 dist 产物库 *.egg .* _darcs CVS node_modules venv {arch}
